services:
  - type: web
    name: concept-crack
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    branch: dev
    envVars:
      - key: VITE_GEMINI_API_KEY
        sync: false
    # SPA fallback: serve index.html for any path so client-side routes
    # (e.g. /student/assigned-tests) work on refresh / direct load.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
